<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Companion for This Moment</title>
  <meta name="theme-color" content="#4A90D9">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f7fa; color: #333; }
    #app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: white; padding: 20px; }
    .screen { display: none; }
    .screen.active { display: block; }
    h1 { font-size: 1.8rem; margin-bottom: 1.5rem; text-align: center; color: #2c3e50; }
    .big-btn { display: block; width: 100%; padding: 1.4rem; font-size: 1.3rem; background: #4A90D9; color: white; border: none; border-radius: 12px; margin: 1rem 0; cursor: pointer; }
    .mode-select { display: flex; justify-content: center; gap: 2rem; margin: 1rem 0; }
    .link-btn { background: none; border: none; color: #4A90D9; font-size: 1rem; margin: 1rem auto; display: block; cursor: pointer; }
    .disclaimer { font-size: 0.75rem; color: #888; text-align: center; margin-top: 1.5rem; }
    .crisis-btn { background: #e74c3c; color: white; border: none; padding: 0.6rem 1rem; border-radius: 8px; position: fixed; bottom: 20px; right: 20px; cursor: pointer; }
    .message { font-size: 1.15rem; line-height: 1.6; margin: 1.5rem 0; min-height: 5rem; }
    .buttons { display: flex; flex-direction: column; gap: 0.7rem; }
    .buttons button { padding: 1rem; font-size: 1.05rem; border: 1px solid #4A90D9; background: white; border-radius: 8px; cursor: pointer; }
    .stop-btn { margin-top: 1.5rem; background: #eee; border: none; padding: 0.8rem; width: 100%; border-radius: 8px; }
    #memory-list { list-style: none; margin: 1rem 0; }
    #memory-list li { padding: 0.8rem; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
    .danger-btn { background: #e74c3c; color: white; border: none; padding: 0.8rem; width: 100%; border-radius: 8px; margin-top: 1rem; }
    .progress { font-size: 0.85rem; color: #666; margin-bottom: 0.5rem; }
    #user-input { width: 100%; padding: 0.8rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 8px; margin: 0.5rem 0; display: none; }
    #send-btn { display: none; width: 100%; padding: 0.8rem; background: #4A90D9; color: white; border: none; border-radius: 8px; margin-top: 0.3rem; }
  </style>
</head>
<body>
  <div id="app">
    <div id="home" class="screen active">
      <h1>Companion for This Moment</h1>
      <button id="start-btn" class="big-btn">I need to calm down</button>
      <div class="mode-select">
        <label><input type="radio" name="mode" value="text" checked> Text</label>
        <label><input type="radio" name="mode" value="voice"> Voice</label>
      </div>
      <button id="memory-btn" class="link-btn">What helped me</button>
      <p class="disclaimer">Personal support tool. Not therapy or an emergency service.</p>
      <button id="crisis-btn" class="crisis-btn">Emergency Help</button>
    </div>

    <div id="session" class="screen">
      <div id="progress" class="progress"></div>
      <div id="message" class="message"></div>
      <textarea id="user-input" rows="3" placeholder="Type here..."></textarea>
      <button id="send-btn">Send</button>
      <div id="buttons" class="buttons"></div>
      <button id="stop-btn" class="stop-btn">Stop</button>
      <button id="crisis-btn-session" class="crisis-btn">Emergency Help</button>
    </div>

    <div id="memory" class="screen">
      <h2>What Helped Me</h2>
      <ul id="memory-list"></ul>
      <button id="back-home" class="link-btn">Back Home</button>
      <button id="clear-memory" class="danger-btn">Delete All</button>
    </div>

    <div id="crisis" class="screen">
      <h2>Emergency Help</h2>
      <p>If you are in immediate danger, call now:</p>
      <p style="font-size:1.4rem;font-weight:bold;margin:0.6rem 0;">Emergency: 911 (or local)</p>
      <p style="font-size:1.4rem;font-weight:bold;margin:0.6rem 0;">Crisis Line: 988 (US) or local</p>
      <button id="back-from-crisis" class="link-btn">Back</button>
    </div>
  </div>

  <script>
    let currentScreen = 'home';
    let currentState = 'opening';
    let memory = JSON.parse(localStorage.getItem('anxietyMemory') || '[]');
    let lastHelpful = null;
    let voiceMode = false;
    let step = 0;
    let userThought = '';

    const CRISIS_KEYWORDS = ['suicide', 'kill myself', 'end my life', 'want to die', 'hurt myself', 'self-harm'];

    function checkCrisis(text) {
      if (!text) return false;
      return CRISIS_KEYWORDS.some(k => text.toLowerCase().includes(k));
    }

    function showScreen(name) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(name).classList.add('active');
      currentScreen = name;
      hideInput();
    }

    function showInput() {
      document.getElementById('user-input').style.display = 'block';
      document.getElementById('send-btn').style.display = 'block';
      document.getElementById('user-input').value = '';
      document.getElementById('user-input').focus();
    }

    function hideInput() {
      document.getElementById('user-input').style.display = 'none';
      document.getElementById('send-btn').style.display = 'none';
    }

    document.querySelectorAll('input[name="mode"]').forEach(r => {
      r.onchange = () => { voiceMode = r.value === 'voice'; };
    });

    document.getElementById('start-btn').onclick = () => { showScreen('session'); startSession(); };
    document.getElementById('memory-btn').onclick = () => { renderMemory(); showScreen('memory'); };
    document.getElementById('crisis-btn').onclick = () => showScreen('crisis');
    document.getElementById('crisis-btn-session').onclick = () => showScreen('crisis');
    document.getElementById('back-from-crisis').onclick = () => showScreen(currentScreen === 'session' ? 'session' : 'home');
    document.getElementById('back-home').onclick = () => showScreen('home');
    document.getElementById('clear-memory').onclick = () => {
      if (confirm('Delete all saved memory?')) {
        memory = [];
        localStorage.setItem('anxietyMemory', JSON.stringify(memory));
        renderMemory();
      }
    };
    document.getElementById('stop-btn').onclick = () => endSession();
    document.getElementById('send-btn').onclick = handleUserInput;

    function speak(text) {
      if (!voiceMode || !window.speechSynthesis) return;
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.9;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    }

    function setProgress(text) {
      document.getElementById('progress').textContent = text || '';
    }

    function getPersonalizedOpening() {
      if (memory.length === 0) {
        return 'I am here with you. We can work with your senses, your breath, or a difficult thought. What feels most useful right now?';
      }
      const last = memory[memory.length - 1];
      return `Last time, "${last}" helped. We can do something similar, or try a different approach. What do you need right now?`;
    }

    const groundingSteps = [
      { prompt: 'Name 5 things you can see around you right now.', progress: 'Grounding 1/5' },
      { prompt: 'Name 4 things you can touch or feel.', progress: 'Grounding 2/5' },
      { prompt: 'Name 3 things you can hear.', progress: 'Grounding 3/5' },
      { prompt: 'Name 2 things you can smell.', progress: 'Grounding 4/5' },
      { prompt: 'Name 1 thing you can taste.', progress: 'Grounding 5/5' }
    ];

    const breathingCycles = [
      { prompt: 'Breathe in slowly through your nose for about 4 seconds.', progress: 'Breathing 1/3' },
      { prompt: 'Gently hold the breath for 2–4 seconds if comfortable.', progress: 'Breathing 2/3' },
      { prompt: 'Breathe out slowly through your mouth for about 6 seconds.', progress: 'Breathing 3/3' }
    ];

    async function startSession() {
      currentState = 'opening';
      step = 0;
      setProgress('');
      hideInput();
      const reply = getPersonalizedOpening();
      showMessage(reply);
      speak(reply);
      showButtons([
        { text: 'Grounding (5-4-3-2-1)', action: () => startGrounding() },
        { text: 'Calm breathing', action: () => startBreathing() },
        { text: 'Work with a thought (CBT)', action: () => startCBT() },
        { text: 'Just talk', action: () => goToState('short_talk') }
      ]);
    }

    function startGrounding() {
      currentState = 'grounding';
      step = 0;
      hideInput();
      nextGrounding();
    }

    function nextGrounding() {
      if (step >= groundingSteps.length) {
        const done = 'You finished the grounding. Notice if anything feels even slightly different.';
        showMessage(done);
        speak(done);
        setProgress('Grounding complete');
        showButtons([
          { text: 'Repeat grounding', action: () => startGrounding() },
          { text: 'Try something else', action: () => startSession() },
          { text: 'Stop', action: () => endSession() }
        ]);
        return;
      }
      const s = groundingSteps[step];
      setProgress(s.progress);
      showMessage(s.prompt);
      speak(s.prompt);
      showButtons([
        { text: 'Next', action: () => { step++; nextGrounding(); } },
        { text: 'Something else', action: () => startSession() },
        { text: 'Stop', action: () => endSession() }
      ]);
    }

    function startBreathing() {
      currentState = 'breathing';
      step = 0;
      hideInput();
      nextBreathing();
    }

    function nextBreathing() {
      if (step >= breathingCycles.length) {
        const done = 'One full cycle completed. You can do another or switch.';
        showMessage(done);
        speak(done);
        setProgress('Breathing cycle done');
        showButtons([
          { text: 'Another cycle', action: () => startBreathing() },
          { text: 'Something else', action: () => startSession() },
          { text: 'Stop', action: () => endSession() }
        ]);
        return;
      }
      const s = breathingCycles[step];
      setProgress(s.progress);
      showMessage(s.prompt);
      speak(s.prompt);
      showButtons([
        { text: 'Next', action: () => { step++; nextBreathing(); } },
        { text: 'Something else', action: () => startSession() },
        { text: 'Stop', action: () => endSession() }
      ]);
    }

    function startCBT() {
      currentState = 'cbt_identify';
      step = 0;
      setProgress('Thought work 1/3');
      const msg = 'What is one difficult thought that is present right now? Type it below.';
      showMessage(msg);
      speak(msg);
      showInput();
      showButtons([
        { text: 'Skip this', action: () => { hideInput(); startSession(); } }
      ]);
    }

    function cbtChallenge() {
      currentState = 'cbt_challenge';
      setProgress('Thought work 2/3');
      const msg = 'Is this thought 100% true, or is there another way to see it? What evidence supports or contradicts it? Type your thoughts.';
      showMessage(msg);
      speak(msg);
      showInput();
      showButtons([
        { text: 'Something else', action: () => { hideInput(); startSession(); } }
      ]);
    }

    function cbtReframe() {
      currentState = 'cbt_reframe';
      setProgress('Thought work 3/3');
      const msg = 'Can you find a more balanced or helpful way to phrase this thought? Type it below.';
      showMessage(msg);
      speak(msg);
      showInput();
      showButtons([
        { text: 'Try again', action: () => { hideInput(); startCBT(); } }
      ]);
    }

    function goToState(state) {
      currentState = state;
      setProgress('');
      const msg = 'What is happening for you right now? Type as much or as little as you want.';
      showMessage(msg);
      speak(msg);
      showInput();
      showButtons([]);
    }

    function handleUserInput() {
      const text = document.getElementById('user-input').value.trim();
      if (!text) return;
      if (checkCrisis(text)) {
        showScreen('crisis');
        return;
      }
      document.getElementById('user-input').value = '';
      hideInput();

      if (currentState === 'cbt_identify') {
        userThought = text;
        cbtChallenge();
      } else if (currentState === 'cbt_challenge') {
        cbtReframe();
      } else if (currentState === 'cbt_reframe') {
        endSession();
      } else if (currentState === 'short_talk') {
        const ack = 'Thank you for sharing. I am here with you.';
        showMessage(ack);
        speak(ack);
        showButtons([
          { text: 'Done', action: () => endSession() },
          { text: 'Say more', action: () => goToState('short_talk') }
        ]);
      }
    }

    function endSession() {
      lastHelpful = currentState;
      hideInput();
      setProgress('');
      const msg = 'Was anything helpful in this moment?';
      showMessage(msg);
      speak(msg);
      showButtons([
        { text: 'Yes, save it', action: () => saveMemory(describeHelpful()) },
        { text: 'No thanks', action: () => showScreen('home') }
      ]);
    }

    function describeHelpful() {
      const map = {
        grounding: 'Grounding (5-4-3-2-1)',
        breathing: 'Calm breathing',
        cbt_identify: 'Working with a thought',
        cbt_challenge: 'Working with a thought',
        cbt_reframe: 'Working with a thought',
        short_talk: 'Talking it through'
      };
      return map[currentState] || 'An exercise helped';
    }

    function saveMemory(item) {
      if (!memory.includes(item)) {
        memory.push(item);
        localStorage.setItem('anxietyMemory', JSON.stringify(memory));
      }
      showScreen('home');
    }

    function showMessage(text) {
      document.getElementById('message').textContent = text;
    }

    function showButtons(btns) {
      const container = document.getElementById('buttons');
      container.innerHTML = '';
      btns.forEach(b => {
        const btn = document.createElement('button');
        btn.textContent = b.text;
        btn.onclick = b.action;
        container.appendChild(btn);
      });
    }

    function renderMemory() {
      const list = document.getElementById('memory-list');
      list.innerHTML = '';
      if (memory.length === 0) {
        list.innerHTML = '<li>No saved items yet</li>';
        return;
      }
      memory.forEach((item, i) => {
        const li = document.createElement('li');
        li.innerHTML = `<span>${item}</span> <button onclick="deleteItem(${i})">Delete</button>`;
        list.appendChild(li);
      });
    }

    function deleteItem(index) {
      memory.splice(index, 1);
      localStorage.setItem('anxietyMemory', JSON.stringify(memory));
      renderMemory();
    }

    showScreen('home');
  </script>
</body>
</html>
